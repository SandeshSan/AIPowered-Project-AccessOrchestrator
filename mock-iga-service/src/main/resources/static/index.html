<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock IGA Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --accent: #2f6fed; --ok: #1f9d55; --warn: #c27c0e; --bad: #d64545; --upcoming: #c9ced6;
    --chip-bg: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e7eaf0; --muted: #98a2b3; --border: #2c323d;
      --accent: #6c9bff; --ok: #3ccf7c; --warn: #f0b247; --bad: #ff6b6b; --upcoming: #3a414d;
      --chip-bg: #252b35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; padding: 16px 24px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .list { padding: 8px; max-height: calc(100vh - 120px); overflow: auto; }
  .list h2, .detail h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                         margin: 8px 8px 12px; }
  .item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: var(--chip-bg); }
  .item.selected { border-color: var(--accent); background: var(--chip-bg); }
  .item .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .item .id { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
           background: var(--chip-bg); }
  .badge.PENDING_APPROVAL { color: var(--warn); }
  .badge.APPROVED, .badge.PROVISIONING { color: var(--accent); }
  .badge.PROVISIONED { color: var(--ok); }
  .badge.REJECTED { color: var(--bad); }
  .badge.CANCELLED { color: var(--muted); }
  .type { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: .03em;
          text-transform: uppercase; background: var(--chip-bg); color: var(--muted); }
  .type.REVOKE { background: rgba(214, 69, 69, .12); color: var(--bad); }
  .detail { padding: 20px 24px; min-height: 320px; }
  .empty { color: var(--muted); padding: 24px 8px; }
  .title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title h3 { margin: 0; font-size: 20px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip-bg); padding: 2px 8px; border-radius: 6px; font-family: ui-monospace, monospace;
          font-size: 12px; }

  /* Lifecycle stepper */
  .stepper { list-style: none; padding: 0; margin: 20px 0; display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; position: relative; padding-bottom: 18px; }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px;
                  background: var(--upcoming); }
  .step:last-child::before { display: none; }
  .step.COMPLETED::before { background: var(--ok); }
  .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px;
         font-weight: 700; border: 2px solid var(--upcoming); color: var(--upcoming); background: var(--panel); }
  .step.COMPLETED .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step.CURRENT .dot { border-color: var(--accent); color: var(--accent); animation: pulse 1.4s infinite; }
  .step.REJECTED .dot { background: var(--bad); border-color: var(--bad); color: #fff; }
  .step.CANCELLED .dot { background: var(--upcoming); border-color: var(--upcoming); color: #fff; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(47,111,237,.45); } 50% { box-shadow: 0 0 0 6px rgba(47,111,237,0); } }
  @media (prefers-reduced-motion: reduce) { .step.CURRENT .dot { animation: none; } }
  .step .label { font-weight: 600; padding-top: 3px; }
  .step.UPCOMING .label { color: var(--muted); font-weight: 500; }
  .step .when { color: var(--muted); font-size: 12px; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  input[type=text] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
                     color: var(--text); min-width: 0; flex: 1 1 200px; font: inherit; }
  button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.reject { color: var(--bad); border-color: var(--bad); }
  .history { margin-top: 24px; }
  .history table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .history th, .history td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
  .history th { color: var(--muted); font-weight: 500; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff;
           padding: 10px 16px; border-radius: 8px; display: none; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header>
  <h1>Mock IGA Console</h1>
  <span class="sub">Manager approvals &amp; simulated provisioning</span>
  <span class="spacer"></span>
  <button id="demo" title="Create a sample request for NT10036">+ Demo request</button>
</header>
<main>
  <section class="panel list" aria-label="Requests">
    <h2>Requests</h2>
    <div id="list"><div class="empty">No requests yet.</div></div>
  </section>
  <section class="panel detail" aria-live="polite">
    <div id="detail"><div class="empty">Select a request to review it.</div></div>
  </section>
</main>
<div class="toast" id="toast" role="alert"></div>

<script>
const API = '/mock-iga/access-requests';
let selectedId = null;
let requests = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleTimeString() : '';
const labelOf = (s, type) => ({PENDING_APPROVAL:'Pending Approval', APPROVED:'Approved', REJECTED:'Rejected',
                       CANCELLED:'Cancelled',
                       PROVISIONING: type === 'REVOKE' ? 'Revoking' : 'Provisioning',
                       PROVISIONED: type === 'REVOKE' ? 'Revoked' : 'Provisioned',
                       CREATED: type === 'REVOKE' ? 'Revocation Requested' : 'Request Created'}[s] || s);
const typeLabel = t => t === 'REVOKE' ? 'Revocation' : 'Grant';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 4000);
}

async function call(method, url, body) {
  const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'},
                                 body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

async function refresh() {
  try {
    requests = await call('GET', API);
    if (!selectedId && requests.length) selectedId = requests[0].requestId;
    renderList();
    renderDetail(requests.find(r => r.requestId === selectedId));
  } catch (e) { /* server restarting; keep last view */ }
}

function renderList() {
  const el = document.getElementById('list');
  if (!requests.length) { el.innerHTML = '<div class="empty">No requests yet.</div>'; return; }
  el.innerHTML = requests.map(r => `
    <div class="item ${r.requestId === selectedId ? 'selected' : ''}" data-id="${esc(r.requestId)}" tabindex="0">
      <div class="row"><span class="id">${esc(r.requestId)} <span class="type ${esc(r.type)}">${typeLabel(r.type)}</span></span>
        <span class="badge ${esc(r.status)}">${esc(r.statusLabel)}</span></div>
      <div class="meta">${esc(r.userId)} · ${r.entitlements.length} entitlement(s) · ${fmt(r.createdAt)}</div>
    </div>`).join('');
}

function renderDetail(r) {
  const el = document.getElementById('detail');
  if (!r) { el.innerHTML = '<div class="empty">Select a request to review it.</div>'; return; }
  const pending = r.status === 'PENDING_APPROVAL';
  el.innerHTML = `
    <div class="title"><h3>${esc(r.requestId)}</h3><span class="type ${esc(r.type)}">${typeLabel(r.type)}</span>
      <span class="badge ${esc(r.status)}">${esc(r.statusLabel)}</span></div>
    <dl>
      <dt>User</dt><dd>${esc(r.userId)}</dd>
      <dt>Requested by</dt><dd>${esc(r.requestedBy)}</dd>
      ${r.externalReference ? `<dt>Orchestrator ref</dt><dd>${esc(r.externalReference)}</dd>` : ''}
      ${r.justification ? `<dt>${r.type === 'REVOKE' ? 'Reason' : 'Justification'}</dt><dd>${esc(r.justification)}</dd>` : ''}
      <dt>${r.type === 'REVOKE' ? 'Revoke' : 'Entitlements'}</dt><dd class="chips">${r.entitlements.map(e => `<span class="chip">${esc(e)}</span>`).join('')}</dd>
      ${r.decidedBy ? `<dt>Decision by</dt><dd>${esc(r.decidedBy)}${r.decisionComment ? ' — ' + esc(r.decisionComment) : ''}</dd>` : ''}
    </dl>
    <ol class="stepper" aria-label="Lifecycle">
      ${r.lifecycle.map(s => `
        <li class="step ${s.state}">
          <span class="dot">${s.state === 'COMPLETED' ? '&#10003;' : (s.state === 'REJECTED' || s.state === 'CANCELLED') ? '&#10005;' : ''}</span>
          <div><div class="label">${esc(s.label)}</div><div class="when">${fmt(s.at)}</div></div>
        </li>`).join('')}
    </ol>
    <div class="actions">
      <input type="text" id="comment" placeholder="Comment (optional)" ${pending ? '' : 'disabled'}>
      <button class="approve" data-act="approve" ${pending ? '' : 'disabled'}>Approve</button>
      <button class="reject" data-act="reject" ${pending ? '' : 'disabled'}>Reject</button>
    </div>
    <div class="history">
      <h2>Audit trail</h2>
      <table><thead><tr><th>Time</th><th>Status</th><th>Actor</th><th>Comment</th></tr></thead><tbody>
        ${r.history.map(h => `<tr><td>${fmt(h.at)}</td><td>${esc(labelOf(h.status, r.type))}</td>
          <td>${esc(h.actor)}</td><td>${esc(h.comment)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}

document.getElementById('list').addEventListener('click', e => {
  const item = e.target.closest('.item'); if (!item) return;
  selectedId = item.dataset.id; renderList(); renderDetail(requests.find(r => r.requestId === selectedId));
});
document.getElementById('list').addEventListener('keydown', e => {
  if (e.key === 'Enter') e.target.closest('.item')?.click();
});
document.getElementById('detail').addEventListener('click', async e => {
  const act = e.target.dataset?.act; if (!act || !selectedId) return;
  const comment = document.getElementById('comment')?.value || null;
  try {
    await call('POST', `${API}/${encodeURIComponent(selectedId)}/${act}`, { actor: 'manager', comment });
    await refresh();
  } catch (err) { toast(err.message); }
});
document.getElementById('demo').addEventListener('click', async () => {
  try {
    const r = await call('POST', API, { userId: 'NT10036',
      entitlements: ['NOVATECH_JIRA', 'NOVATECH_DB_READ', 'NOVATECH_VPN'],
      justification: 'Joined the Novatech project' });
    selectedId = r.requestId; await refresh();
  } catch (err) { toast(err.message); }
});

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
